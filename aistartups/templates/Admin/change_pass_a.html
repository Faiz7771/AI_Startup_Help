{% extends 'Admin/admin_header.html' %}
<html>
<head>
    <title>Change your password</title>
    <link rel="stylesheet" href="/static/assets/css/professional_styles.css">
</head>
{% block body %}
<body>
{% if messages %}

{% for i in messages %}
<div class="alert alert-danger">{{ i }}</div>
{% endfor %}
{% endif %}
<form action="/myapp/change_pass_a_post/" method="post">
    <h1>Change Password</h1>
    <label>Current Password:</label>
    <input type="password" placeholder="-Enter password-" name="CURRENTPASS"><br><br>
    <label>New Password:</label>
    <input type="password" placeholder="-Enter password-" name="NEWPASS"><br><br>
    <label>Confirm Password:</label>
    <input type="password" placeholder="-Enter password-" name="CONFIRMPASS"><br><br>
    <input type="submit" value="submit">
</form>
</body>
{% endblock %}
</html>
