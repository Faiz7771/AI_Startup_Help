{% extends 'Expert/expert_header.html' %}
{% block exp %}
<html>
<head>
    <title>Edit profile</title>
    <link rel="stylesheet" href="/static/assets/css/professional_styles.css">
</head>
<body>
<form action="/myapp/edit_profile_post/" method="post" enctype="multipart/form-data">
    <h3 align="center"><b>Editing Profile {{ data.name }}:-</b></h3>
    <label>Name:</label>
    <input type="text" placeholder="-Enter your name-" name="NAME" value="{{ data.name }}"><br><br>
    <label>Phone no.:</label>
    <input type="text" placeholder="-Enter Phone no.-" name="PHONENO" value="{{ data.phone }}"><br><br>
    <label>Photo:</label>
    <img class='rounded-2' src='/media/{{ data.photo }}' height='80' width='80'><br>
    <input type="file" name="PHOTO"><br><br>
    <label>Place:</label>
    <input type="text" placeholder="-Enter your location-" name="PLACE" value="{{ data.place }}"><br><br>
    <label>Post:</label>
    <input type="text" placeholder="-Enter your post-" name="POST" value="{{ data.post }}"><br><br>
    <label>Pin:</label>
    <input type="text" placeholder="-Enter pincode-" name="PIN" value="{{ data.pin }}"><br><br>
    <label>District:</label>
    <input type="text" placeholder="-Enter district-" name="DISTRICT" value="{{ data.district }}"><br><br>
    <label>Proof:</label>
    <img class='rounded-2' src='/media/{{ data.proof }}' height='80' width='80'><br>
    <input type="file" name="PHOTO"><br><br>
    <input type="submit" value="submit">
</form>
</body>
{% endblock %}
</html>
