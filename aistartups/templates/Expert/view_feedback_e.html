{% extends 'Expert/expert_header.html' %}
{% block exp %}
<html>
<head>
    <title>View Feedback</title>
    <link rel="stylesheet" href="/static/assets/css/professional_styles.css">
</head>
<body>
<br>
<table border="2">
    <thead>
    <th>SI_No</th>
    <th>Date</th>
    <th>Feedback</th>
    <th>Student_details</th>
    </thead>
    {% for i in data %}
    <tbody>
    <td>{{ forloop.counter }}</td>
    <td>{{ i.date }}</td>
    <td>{{ i.feedback }}</td>
    <td>{{ i.user }}</td>
    </tbody>
    {% endfor %}
</table>
</body>
{% endblock %}
</html>
